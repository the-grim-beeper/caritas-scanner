# Source catalogue — Horizon scanner for social provision in Landkreis Miesbach (Caritas-Zentrum Miesbach).
#
# Rebuilt 2026-10-14 from docs/brief/source-architecture.txt (deep-research report, research cut
# 8 Oct 2026) plus endpoint discovery, then merged with a second deep-research report
# (gemini-monitoring.md, 14 Oct 2026; every URL it gives was reopened — several were extrapolated).
# Replaces the earlier Rhein-Neckar catalogue entirely.
#
# Every rss/page/diff/pdf URL below was fetched on 2026-10-14 with a browser User-Agent; the notes
# record what came back ("checked 2026-10-14: 200, N items"). Entries that did NOT verify (bot
# challenges, timeouts, script-only sites) are kept and say so in their notes — they are intent,
# not evidence. scripts/check_sources.py decides what is actually collected.
#
# method: rss | page | query | diff | pdf (collected) · newsletter | api | social (catalogued only)
#   diff = structural page whose text changes matter; pdf = listing page whose linked PDFs matter.
# priority: core = the report's 38-source v1 core (municipal slots filled with the durable endpoint
#   found here, incl. Rottach-Egern and Weyarn) + all municipal Google News queries; else thematic.
# brief_ref: report footnote number | discovery (found in this pass) | unverified-bundle (the report's
#   "plausible, unverified" set, now checked) | report2 (second report only) | report2+<ref> (both).
#
# Platform notes from discovery:
#   - Advantic "Kommune" CMS (Landkreis, Bad Wiessee, Gmund, Kreuth, Rottach-Egern, Tegernsee): no RSS;
#     list pages are "Mitteilungsverzeichnis"; every page has a 4-item Aktuelles sidebar.
#   - cross-7 TYPO3 (Bayrischzell, Hausham): news comes from https://api.cross-7.de/public/news/<data-c7-page>/articles/rss.
#   - SessionNet on digitalfabrix (Bad Wiessee, Gmund, Otterfing, Waakirchen): rssfeed.asp.
#   - komuna RIS (Hausham, Holzkirchen, Kreuth, Miesbach, Rottach-Egern, Weyarn) and ALLRIS 4
#     (Landkreis, Fischbachau, Tegernsee) are JS apps: not scrapeable without a browser. Poliscope
#     (third-party, authority low) publishes server-rendered summaries for those municipalities.
#   - Bot challenges (403): caritas-nah-am-naechsten.de (all Caritas München-Freising pages).
#   - PDFs without a .pdf extension: Irschenberg slugs, Holzkirchen /ceasy/resource/, Rottach-Egern
#     loadDocument.phtml — the pdf collector should sniff content-type.

# =============================================================================
# gemeinden — the 17 municipalities (council/RIS, news, bulletins, budgets; Poliscope summaries at the end)
# =============================================================================
