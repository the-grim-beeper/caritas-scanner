[project]
name = "rns"
version = "0.1.0"
description = "Rhein-Neckar Horizon Scanner — six-layer regional signal scanner built to the Pharos brief"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "greenlet>=3.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3.6",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "feedparser>=6.0.11",
    "selectolax>=0.3.21",
    "pyyaml>=6.0",
    "anthropic>=0.42",
    "fastembed>=0.4",
    "numpy>=1.26",
    "apscheduler>=3.11",
    "itsdangerous>=2.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
test = ["pytest>=8.3", "pytest-asyncio>=0.25", "respx>=0.22"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rns*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
